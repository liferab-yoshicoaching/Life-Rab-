<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life-Rab 練習マッチング｜試用版</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#183047;margin:0}header{background:#174a70;color:white;padding:22px}main{max-width:860px;margin:auto;padding:18px}.card{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 9px #dbe2e9}button{background:#1766a0;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;margin:4px}button.secondary{background:#e9eff4;color:#183047}input,select{padding:10px;border:1px solid #cbd5df;border-radius:8px;max-width:100%;box-sizing:border-box}input[type=url]{width:100%}.muted{color:#607789;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:58px;background:#f0f5f9;color:#183047;margin:0;padding:4px}.selected{outline:3px solid #1766a0}.notice{background:#fff4dc;padding:12px;border-radius:8px}label{display:block;margin:8px 0}h1{font-size:24px}h2{font-size:19px}dialog{border:0;border-radius:14px;max-width:360px;box-shadow:0 10px 40px #4565}dialog::backdrop{background:#0008}</style><header><h1>Life-Rab｜練習マッチング</h1><div>受講生向け・試用版 v1.1</div></header><main><div class="notice">これは架空データを使ったデモです。認証・安全なデータ保存・通知機能はありません。実際の個人情報やZoom URLは入力しないでください。</div><div class="card"><label>デモ操作ユーザー <select id="user"></select></label><div class="row"><button onclick="tab='calendar';render()">カレンダー</button><button onclick="tab='mine';render()">自分の予定</button><button onclick="tab='new';render()">募集する</button><button onclick="tab='admin';render()">管理者機能（デモ）</button></div></div><div class="card"><button id="healthCheck" type="button">動作テスト</button><span id="healthResult">ここを押して確認</span></div><div id="view"></div></main><dialog id="dialog"><div id="dialogText"></div><div class="row"><button class="secondary" onclick="dialog.close()">戻る</button><button id="dialogOK">参加を確定する</button></div></dialog><script>
let users={a:{name:'山田さん',group:'g1'},b:{name:'佐藤さん',group:'g1'},c:{name:'田中さん',group:'g1'},d:{name:'鈴木さん',group:'g2'}},groups={g1:'Aスクール',g2:'Bスクール'},me='a',tab='calendar',year=2026,month=10,selected='2026-11-04',seq=5;
let slots=[{id:1,host:'b',guest:null,date:'2026-11-04',time:'20:00',zoom:'',pending:null},{id:2,host:'c',guest:null,date:'2026-11-06',time:'14:00',zoom:'',pending:null},{id:3,host:'a',guest:'b',date:'2026-11-09',time:'19:00',zoom:'',pending:null},{id:4,host:'d',guest:null,date:'2026-11-04',time:'19:00',zoom:'',pending:null}];
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),name=id=>users[id]?.name||'',mine=s=>s.host===me||s.guest===me,visible=s=>users[s.host].group===users[me].group,other=s=>s.host===me?s.guest:s.host,fmt=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
window.addEventListener('error',e=>{const el=document.getElementById('healthResult');if(el)el.textContent='エラー: '+e.message});document.getElementById('healthCheck').addEventListener('click',()=>{document.getElementById('healthResult').textContent='ボタンは動作しています！'});function render(){ $('user').innerHTML=Object.entries(users).map(([id,u])=>'<option value="'+id+'" '+(me===id?'selected':'')+'>'+esc(u.name)+'｜'+esc(groups[u.group])+'</option>').join('');let h='';if(tab==='calendar'){h='<section class="card"><div class="row"><button onclick="shift(-1)">前月</button><h2>'+year+'年'+(month+1)+'月</h2><button onclick="shift(1)">翌月</button></div><div class="grid">'+['日','月','火','水','木','金','土'].map(x=>'<strong>'+x+'</strong>').join('');let first=new Date(year,month,1).getDay(),n=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++)h+='<span></span>';for(let d=1;d<=n;d++){let date=fmt(year,month,d),count=slots.filter(s=>s.date===date&&visible(s)&&!s.guest).length;h+='<button class="day '+(date===selected?'selected':'')+'" onclick="selected=\''+date+'\';render()">'+d+(count?'<br>'+count+'件':'')+'</button>'}h+='</div></section><section class="card"><h2>'+selected+' の練習</h2>';let list=slots.filter(s=>s.date===selected&&visible(s));h+=list.length?list.map(s=>'<p><b>'+esc(s.time)+'</b>　'+esc(name(s.host))+(s.guest?' × '+esc(name(s.guest)):'（募集中）')+(s.guest||s.host===me?'':' <button onclick="join('+s.id+')">参加する</button>')+'</p>').join(''):'募集はありません';h+='</section>'}
if(tab==='mine'){let list=slots.filter(mine);h='<section class="card"><h2>自分の予定</h2>'+(list.length?list.map(s=>'<article class="card"><b>'+esc(s.date)+' '+esc(s.time)+'</b><p>'+esc(name(s.host))+(s.guest?' × '+esc(name(s.guest)):'（募集中）')+'</p>'+(s.guest?'<label>Zoom URL（デモ用の架空URLのみ）<input type="url" id="z'+s.id+'" value="'+esc(s.zoom)+'" placeholder="https://zoom.us/j/..."></label><button onclick="zoom('+s.id+')">リンク保存</button>'+(s.zoom?'<p class="muted">保存済み（実際の会議リンクは入力しないでください）</p>':'')+(s.pending?(s.pending.by===me?'<p>申請中：相手の承認待ち</p>':'<p>申請：'+(s.pending.type==='cancel'?'キャンセル':'日時変更 '+esc(s.pending.date)+' '+esc(s.pending.time))+'</p><button onclick="decision('+s.id+',true)">承認</button><button class="secondary" onclick="decision('+s.id+',false)">却下</button>'):'<label>変更希望日 <input type="date" id="d'+s.id+'" value="'+esc(s.date)+'"></label><label>変更希望時間 <input type="time" id="t'+s.id+'" value="'+esc(s.time)+'"></label><button onclick="change('+s.id+')">変更を申請</button><button class="secondary" onclick="cancelReq('+s.id+')">キャンセルを申請</button>'):'<button class="secondary" onclick="withdraw('+s.id+')">募集を取り下げる</button>')+'</article>').join(''):'予定なし')+'</section>'}
if(tab==='new')h='<section class="card"><h2>練習を募集する</h2><p>'+esc(groups[users[me].group])+'の受講生向け</p><form onsubmit="create(event)"><label>日付 <input id="newdate" type="date" required value="2026-11-04"></label><label>時間 <input id="newtime" type="time" required value="20:00"></label><button>募集する</button></form></section>';
if(tab==='admin')h='<section class="card"><h2>管理者機能（操作体験用）</h2><p class="muted">本番では別サイト・管理者ログインが必要です。</p><h3>受講生管理</h3>'+Object.entries(users).map(([id,u])=>'<div class="card"><label>名前 <input id="name'+id+'" value="'+esc(u.name)+'"></label><label>所属 <select id="group'+id+'">'+Object.entries(groups).map(([gid,g])=>'<option value="'+gid+'" '+(gid===u.group?'selected':'')+'>'+esc(g)+'</option>').join('')+'</select></label><button onclick="saveUser(\''+id+'\')">変更を保存</button></div>').join('')+'<h3>グループ管理</h3>'+Object.entries(groups).map(([id,g])=>'<div class="card"><label>グループ名 <input id="gname'+id+'" value="'+esc(g)+'"></label><button onclick="saveGroup(\''+id+'\')">保存</button></div>').join('')+'</section>';
$('view').innerHTML=h}
$('user').onchange=e=>{me=e.target.value;render()};function shift(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}selected=fmt(year,month,1);render()}function find(id){return slots.find(s=>s.id===id)}function join(id){let s=find(id);if(!s||s.guest||s.host===me||!visible(s))return;$('dialogText').innerHTML='<h2>本当によろしいですか？</h2><p>'+esc(s.date)+' '+esc(s.time)+'｜'+esc(name(s.host))+'</p><p>確定後のキャンセルには相手の承認が必要です。</p>';$('dialogOK').onclick=()=>{if(!s.guest&&visible(s)){s.guest=me;tab='mine'}$('dialog').close();render()};$('dialog').showModal()}function zoom(id){let s=find(id),url=$('z'+id).value.trim();if(!mine(s)||!s.guest)return;if(url&&!/^https:\/\/([a-z0-9-]+\.)?zoom\.us\/j\/\d+(?:\?[^\s]*)?$/i.test(url)){alert('ZoomのURL形式を確認してください');return}s.zoom=url;render()}function change(id){let s=find(id),date=$('d'+id).value,time=$('t'+id).value;if(s.pending||!date||!time||(date===s.date&&time===s.time))return alert('新しい日時を指定してください');s.pending={type:'change',by:me,date,time};render()}function cancelReq(id){let s=find(id);if(!s.pending&&confirm('キャンセル申請を送りますか？')){s.pending={type:'cancel',by:me};render()}}function decision(id,ok){let s=find(id),p=s.pending;if(!p||p.by===me)return;if(ok){if(p.type==='cancel')slots=slots.filter(x=>x.id!==id);else{s.date=p.date;s.time=p.time}}else alert('申請を却下しました。元の予定は維持されます');s.pending=null;render()}function withdraw(id){let s=find(id);if(s.host===me&&!s.guest&&confirm('募集を取り下げますか？')){slots=slots.filter(x=>x.id!==id);render()}}function create(e){e.preventDefault();slots.push({id:seq++,host:me,guest:null,date:$('newdate').value,time:$('newtime').value,zoom:'',pending:null});tab='mine';render()}function saveUser(id){let n=$('name'+id).value.trim();if(!n)return alert('名前を入力してください');users[id].name=n;users[id].group=$('group'+id).value;render()}function saveGroup(id){let n=$('gname'+id).value.trim();if(!n)return alert('グループ名を入力してください');groups[id]=n;render()}render();
</script></html>
